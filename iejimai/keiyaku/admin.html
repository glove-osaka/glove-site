<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>電子契約の管理｜家じまい相談窓口</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="keiyaku.css">
</head>
<body>
<div class="demo" id="demoBar" hidden>お試し表示です（メールは送られず、この端末の中だけで動きます）</div>
<header class="top"><div class="in"><span class="brand"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="22.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 24 24 13l14 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 21.5V35h20V21.5" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><span><b>家じまい相談窓口</b><small>電子契約の管理（担当者用）</small></span></span>
</div></header>
<main>
<section class="card" id="gate" hidden>
<h2>管理画面は、家じまい専用の Google アカウントで開きます</h2>
<p>合言葉は要りません。家じまい専用の Google アカウントでログインしたパソコンやスマホから、下のボタンで開いてください。</p>
<p><a class="btn" id="gateLink" href="#">管理画面を開く</a></p>
<p class="hint">ほかのアカウントでは開けないようになっています。</p>
</section>

<div id="panel" hidden>
<section class="card">
<h2>契約書を送る</h2>
<div class="fld"><label for="tpl">契約書の種類</label><select id="tpl"></select></div>
<div class="fld"><label for="pName">相手のお名前<span class="req">必須</span></label><input type="text" id="pName"></div>
<div class="fld" id="pCompanyBox"><label for="pCompany">会社名・屋号（協力企業・法人の場合）</label><input type="text" id="pCompany"></div>
<div class="fld"><label for="pEmail">相手のメールアドレス<span class="req">必須</span></label><input type="email" id="pEmail" autocomplete="off"></div>
<div class="fld"><label>相手に記入してもらう項目</label><div class="chk" id="fieldChk"></div></div>
<div class="fld"><label class="agree" for="reqId" style="padding:12px"><input type="checkbox" id="reqId"><span>本人確認書類の写真の添付を求める</span></label></div>
<div class="fld" id="itemsBox" hidden><label>買い取る物品（品名・数量・金額・特徴）</label><div id="items"></div><button type="button" class="small-btn" id="addItem">＋ 行を足す</button></div>
<div class="fld"><label for="note" id="noteLabel">特記事項</label><textarea id="note" placeholder="なければ空のまま"></textarea></div>
<div class="fld"><label class="agree" for="draft" style="padding:12px"><input type="checkbox" id="draft"><span>下書き（確認用）として送る　※相手は内容を見るだけで、締結はできません</span></label></div>
<p class="err" id="errI" role="alert"></p>
<button class="btn" id="doIssue">メールで送る</button>
<p id="issued" class="note" hidden></p>
</section>

<section class="card">
<h2>送った契約書の一覧</h2>
<div class="tbl"><table class="list"><thead><tr><th>契約番号</th><th>種類</th><th>相手</th><th>状態</th><th>送った日</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="6">読み込み中…</td></tr></tbody></table></div>
<p class="err" id="errR" role="alert"></p>
</section>
</div>
</main>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)},TPL=[],FIELDS={};
var IN_GAS=!!window.IN_GAS;
if(window.KEIYAKU_DEMO&&!IN_GAS)$('demoBar').hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function day(s){if(!s)return'';var d=new Date(s);return isNaN(d)?esc(s):(d.getMonth()+1)+'/'+d.getDate()}
function api(a,d){return keiyakuApi(a,d||{})}
function start(){$('panel').hidden=false;
 api('admin.templates').then(function(r){TPL=r.templates;FIELDS=r.fields;$('tpl').innerHTML=TPL.map(function(t){return'<option value="'+t.key+'">'+esc(t.title)+'</option>'}).join('');onTpl()}).catch(function(e){$('errI').textContent=e.message});list()}
var NOTE={nda:'特記事項',kaitori:'特記事項（引渡しの日時・方法など）',chosei:'費用（例：無料／1件あたり〇〇円 など）',teikei:'その他の提携条件（業務分野・対応地域など）'};
function onTpl(){var t=TPL.filter(function(x){return x.key===$('tpl').value})[0];if(!t)return;
 $('fieldChk').innerHTML=Object.keys(FIELDS).map(function(k){return'<label><input type="checkbox" value="'+k+'"'+(t.defaultFields.indexOf(k)>=0?' checked':'')+(k==='name'?' checked disabled':'')+'>'+esc(FIELDS[k].label)+'</label>'}).join('');
 $('reqId').checked=!!t.requireId;$('itemsBox').hidden=!t.items;if(t.items&&!$('items').children.length)addItem();$('noteLabel').textContent=NOTE[t.key]||'特記事項';$('pCompanyBox').hidden=false}
$('tpl').addEventListener('change',onTpl);
function addItem(){var d=document.createElement('div');d.className='items-row';d.innerHTML='<input placeholder="品名（例：金の指輪）"><input type="number" min="1" value="1" aria-label="数量"><input type="number" min="0" placeholder="金額（円）" aria-label="金額"><input placeholder="特徴（例：18金・約5g）"><button type="button" aria-label="この行を消す">×</button>';d.querySelector('button').onclick=function(){d.remove()};$('items').appendChild(d)}
$('addItem').addEventListener('click',addItem);
$('doIssue').addEventListener('click',function(){var b=this,t=$('tpl').value;
 var fields=[].map.call($('fieldChk').querySelectorAll('input:checked'),function(i){return i.value});
 var items=[].map.call($('items').children,function(r){var i=r.querySelectorAll('input');return{name:i[0].value.trim(),qty:+i[1].value||1,price:+i[2].value||0,note:i[3].value.trim()}}).filter(function(x){return x.name});
 var tp=TPL.filter(function(x){return x.key===t})[0];
 if(tp&&tp.items&&!items.length&&!$('draft').checked){$('errI').textContent='買い取る物品を1つ以上入れてください。';return}
 b.disabled=true;$('errI').textContent='';$('issued').hidden=true;
 api('admin.issue',{template:t,party:{name:$('pName').value.trim(),company:$('pCompany').value.trim(),email:$('pEmail').value.trim()},fields:fields,requireId:$('reqId').checked,items:items,note:$('note').value.trim(),draft:$('draft').checked})
 .then(function(r){$('issued').hidden=false;$('issued').innerHTML='送りました（契約番号 '+esc(r.id)+'）。<br>相手の画面：<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a>';['pName','pCompany','pEmail','note'].forEach(function(id){$(id).value=''});$('items').innerHTML='';onTpl();list()})
 .catch(function(e){$('errI').textContent=e.message}).then(function(){b.disabled=false})});
function list(){api('admin.list').then(function(r){if(!r.rows.length){$('rows').innerHTML='<tr><td colspan="6">まだありません</td></tr>';return}
 $('rows').innerHTML=r.rows.map(function(x){var cls=x.status==='締結済み'?'done':x.status==='取り消し'?'cancel':'';
  return'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.title)+(x.draft==='yes'?'<br><span class="tag">下書き</span>':'')+'</td><td>'+esc(x.party_company?x.party_company+' ':'')+esc(x.party_name)+'<br><small>'+esc(x.party_email)+'</small></td><td><span class="tag '+cls+'">'+esc(x.status)+'</span></td><td>'+day(x.created)+'</td><td>'+
  (x.status==='締結済み'?'<button class="small-btn" data-pdf="'+esc(x.id)+'">PDFを保存</button>':x.status==='取り消し'?'':'<button class="small-btn" data-resend="'+esc(x.id)+'">もう一度送る</button><button class="small-btn" data-cancel="'+esc(x.id)+'">取り消す</button>')+'</td></tr>'}).join('')}).catch(function(e){$('errR').textContent=e.message})}
$('rows').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$('errR').textContent='';
 if(b.dataset.resend)api('admin.resend',{id:b.dataset.resend}).then(function(){$('errR').textContent='もう一度送りました。'}).catch(function(x){$('errR').textContent=x.message});
 if(b.dataset.cancel&&confirm('この契約書を取り消しますか？相手はもう開けなくなります。'))api('admin.cancel',{id:b.dataset.cancel}).then(list).catch(function(x){$('errR').textContent=x.message});
 if(b.dataset.pdf)api('admin.pdf',{id:b.dataset.pdf}).then(function(r){var bin=atob(r.pdf),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);var u=URL.createObjectURL(new Blob([a],{type:'application/pdf'}));var l=document.createElement('a');l.href=u;l.download=r.filename;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove()},2000)}).catch(function(x){$('errR').textContent=x.message})});
if(IN_GAS||window.KEIYAKU_DEMO){start()}else{$('gate').hidden=false;$('gateLink').href=window.KEIYAKU_ADMIN_URL||'#'}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>契約書のご確認とご署名｜京都太陽行政書士事務所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* お客様向けの署名ページ：手順を4段に分け、今どこかが分かる形 */
:root{--sumi:#2d2b27;--text:#4a463f;--green:#4d6b3c;--green-p:#eef2e7;--gold:#b38a3e;--paper:#faf7f0;--white:#fffdf9;--line:#e6dfd1;--red:#a33a3a;--seal:#c0392b;
--display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:var(--body);color:var(--text);font-size:16px;line-height:1.8}
h1,h2{font-family:var(--display);color:var(--sumi);margin:0;line-height:1.5;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.head{background:var(--white);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.head b{font-family:var(--display);font-size:17px;color:var(--sumi)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{text-align:center;font-size:12.5px;font-weight:700;padding:8px 2px;border-radius:8px;background:var(--white);border:1px solid var(--line);color:#8a8478}
.steps li.on{background:var(--green);border-color:var(--green);color:#fff}
.steps li.done{background:var(--green-p);color:var(--green);border-color:#c9d5bd}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.doc{white-space:pre-wrap;font-family:var(--display);font-size:15px;line-height:2;max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff;color:#222}
.field{display:grid;gap:4px}
.field label{font-weight:700;color:var(--sumi);font-size:15px}
.req{font-size:11px;background:#b9727d;color:#fff;border-radius:3px;padding:0 6px;margin-left:6px}
.field input{width:100%;padding:12px 14px;border:1px solid #d8d0bf;border-radius:8px;background:var(--paper);font:inherit;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700;color:var(--sumi);cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:999px;border:1px solid var(--green);background:var(--white);color:var(--green);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn-main{background:var(--green);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.err{color:var(--red);font-weight:700;font-size:14px}
.note{font-size:13px;color:#6b665c}
.seal-box{display:flex;align-items:center;gap:18px;justify-content:center;padding:10px}
.seal{display:inline-flex!important;flex-direction:row-reverse;align-items:center;justify-content:center;gap:2px;border:3px solid #c0392b;border-radius:50%;color:#c0392b;font-family:var(--display);font-weight:700;line-height:1.05;writing-mode:horizontal-tb!important;transform:rotate(-4deg);flex:none}
.seal>span{writing-mode:vertical-rl;letter-spacing:.02em}

.seal-empty{width:84px;height:84px;border:2px dashed #cfc6b2;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a39d90;font-size:13px}
dl{margin:0;display:grid;grid-template-columns:7.5em 1fr;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
dt{font-weight:700;color:var(--sumi)}
dd{word-break:break-all}
@media (max-width:480px){dl{grid-template-columns:1fr}dt{border-bottom:0;padding-bottom:0}.steps li{font-size:11px}}
@media print{.head,.steps,.row,.note.np{display:none!important}.doc{max-height:none;border:0;padding:0}body{background:#fff}}
</style>
</head>
<body>
<div class="head"><svg width="36" height="36" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25" fill="#b38a3e"/><circle cx="26" cy="27" r="7" fill="#fffdf9"/><path d="M0 36 C 10 28, 18 30, 26 34 C 34 29, 42 28, 52 33 V52 H0Z" fill="#fffdf9"/></svg><b>京都太陽行政書士事務所</b></div>
<main class="wrap" id="main">
  <p class="card">読み込んでいます…</p>
</main>
<script src="kt-common.js"></script>
<script>
(()=>{
const {esc,getJ,setJ,nowStr}=KT;
const main=document.getElementById('main');
const token=(location.hash||'').replace(/^#c-/,'');
const REMOTE=!!KT.apiUrl();
let C=null;
async function sha256(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);}}
function fail(m){main.innerHTML=`<div class="card"><h1 style="font-size:20px">契約書を開けませんでした</h1><p>${esc(m)}</p><p class="note">お手数ですが、京都太陽行政書士事務所（電話 ${esc(KT.site('info').tel)}）までご連絡ください。</p></div>`;}
async function load(){
  if(!token){fail('リンクが正しくありません。メールに書かれたリンクをそのまま開いてください。');return;}
  if(REMOTE){try{C=await KT.call('contractGet',{t:token});}catch(e){fail(e.message||'契約書が見つかりませんでした。');return;}}
  else{const a=getJ('kt-db-ctr',[])||[];const c=a.find(x=>x.token===token);if(!c){fail('契約書が見つかりませんでした。取り消された可能性があります。');return;}const cu=(getJ('kt-db-cust',[])||[]).find(x=>x.id===c.custId)||{};C=Object.assign({},c,{cust:{name:cu.name,company:cu.company,title:cu.title,addr:cu.addr,mail:cu.mail,tel:cu.tel}});}
  if(C.status==='取消'){fail('この契約書は取り消されました。');return;}
  if(C.status==='締結'){doneView();return;}
  step1();
}
const steps=n=>`<ol class="steps">${['内容の確認','ご記入','押印','締結'].map((s,i)=>`<li class="${i+1===n?'on':i+1<n?'done':''}">${i+1}. ${s}</li>`).join('')}</ol>`;
let S={};
function step1(){
  main.innerHTML=`${steps(1)}<div class="card"><h1 style="font-size:20px">${esc(C.title||'契約書')}</h1><p class="note">契約書番号 ${esc(C.no||'')}　最後までお読みください。</p><div class="doc" id="doc" tabindex="0">${esc(C.body)}</div><label class="check"><input type="checkbox" id="read"><span>契約書の内容を最後まで読みました</span></label><div class="row"><button class="btn btn-main" id="next" disabled>次へ（ご記入）</button></div><p class="note">ご不明な点は、ご署名の前に事務所へお問い合わせください（電話 ${esc(KT.site('info').tel)}）。</p></div>`;
  const rd=document.getElementById('read'),nx=document.getElementById('next');rd.addEventListener('change',()=>nx.disabled=!rd.checked);nx.addEventListener('click',step2);window.scrollTo(0,0);
}
function step2(){
  const cu=C.cust||{};S.name=S.name||cu.name||'';S.company=S.company??(cu.company||'');S.title=S.title??(cu.title||'');S.addr=S.addr||cu.addr||'';S.mail=S.mail||cu.mail||'';S.tel=S.tel||cu.tel||'';
  const f=(k,l,req,type,ph)=>`<div class="field"><label for="s-${k}">${l}${req?'<span class="req">必須</span>':''}</label><input id="s-${k}" type="${type||'text'}" value="${esc(S[k]||'')}" placeholder="${esc(ph||'')}" autocomplete="${{name:'name',addr:'street-address',mail:'email',tel:'tel',company:'organization',title:'organization-title'}[k]||'off'}"></div>`;
  main.innerHTML=`${steps(2)}<div class="card"><h2 style="font-size:19px">ご契約者の情報</h2>${f('name','お名前',1,'text','例）山田 太郎')}${f('company','会社名（法人の場合）')}${f('title','役職（法人の場合）')}${f('addr','住所',1)}${f('mail','メールアドレス',1,'email')}${f('tel','電話番号',0,'tel')}<p class="err" id="er" role="alert"></p><div class="row"><button class="btn" id="back">戻る</button><button class="btn btn-main" id="next">次へ（押印）</button></div></div>`;
  document.getElementById('back').addEventListener('click',step1);
  document.getElementById('next').addEventListener('click',()=>{['name','company','title','addr','mail','tel'].forEach(k=>S[k]=document.getElementById('s-'+k).value.trim());if(!S.name||!S.addr||!S.mail){document.getElementById('er').textContent='お名前・住所・メールアドレスをご記入ください。';return;}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.mail)){document.getElementById('er').textContent='メールアドレスの形が正しくありません。';return;}step3();});
  window.scrollTo(0,0);
}
function sealText(){return S.name;}
function sealHTML(n,size){n=String(n||'').trim();let a,b;const sp=n.split(/[\s　]+/).filter(Boolean);if(sp.length>=2){a=sp[0];b=sp.slice(1).join('');}else{const t=n.replace(/\s/g,'');a=t.slice(0,Math.ceil(t.length/2));b=t.slice(Math.ceil(t.length/2));}a=a.slice(0,3);b=b.slice(0,3);const L=Math.max(a.length,b.length,1);const fs=Math.round(size*(L>=3?0.24:L===2?0.3:0.42));return `<span class="seal" style="width:${size}px;height:${size}px;font-size:${fs}px"><span>${esc(a)}</span>${b?`<span>${esc(b)}</span>`:''}</span>`;}
function step3(){
  main.innerHTML=`${steps(3)}<div class="card"><h2 style="font-size:19px">押印</h2><p>下のボタンを押すと、お名前の印影が契約書に付きます。</p><div class="seal-box"><div id="sealArea" class="seal-empty">未押印</div><div><b style="font-size:17px">${esc(S.name)}</b>${S.company?`<br><span class="note">${esc(S.company)} ${esc(S.title||'')}</span>`:''}</div></div><div class="row" style="justify-content:center"><button class="btn btn-main" id="stamp">押印する</button></div><p class="err" id="er" role="alert"></p><div class="row"><button class="btn" id="back">戻る</button><button class="btn btn-main" id="next" disabled>次へ（締結）</button></div></div>`;
  const st=document.getElementById('stamp'),nx=document.getElementById('next');
  if(S.stampAt){document.getElementById('sealArea').outerHTML=`<span id="sealArea">${sealHTML(S.name,84)}</span>`;st.textContent='押印し直す';nx.disabled=false;}
  st.addEventListener('click',()=>{S.stampAt=nowStr();document.getElementById('sealArea').outerHTML=`<span id="sealArea">${sealHTML(S.name,84)}</span>`;st.textContent='押印し直す';nx.disabled=false;});
  document.getElementById('back').addEventListener('click',step2);nx.addEventListener('click',step4);window.scrollTo(0,0);
}
function step4(){
  main.innerHTML=`${steps(4)}<div class="card"><h2 style="font-size:19px">内容のご確認と締結</h2><dl><dt>契約書</dt><dd>${esc(C.title)}（${esc(C.no||'')}）</dd><dt>お名前</dt><dd>${esc(S.name)}</dd>${S.company?`<dt>会社名・役職</dt><dd>${esc(S.company)} ${esc(S.title||'')}</dd>`:''}<dt>住所</dt><dd>${esc(S.addr)}</dd><dt>メール</dt><dd>${esc(S.mail)}</dd>${S.tel?`<dt>電話</dt><dd>${esc(S.tel)}</dd>`:''}<dt>押印</dt><dd>${sealHTML(S.name,60)}</dd></dl><label class="check"><input type="checkbox" id="ag"><span>上記の契約書の内容に同意し、電子的な方法で契約を締結します</span></label><p class="note">「同意して締結する」を押した時点で契約が成立します。締結の記録（日時・ご記入内容・契約書の確認番号）は、事務所とお客様の双方で保管します。</p><p class="err" id="er" role="alert"></p><div class="row"><button class="btn" id="back">戻る</button><button class="btn btn-main" id="go" disabled>同意して締結する</button></div></div>`;
  const ag=document.getElementById('ag'),go=document.getElementById('go');ag.addEventListener('change',()=>go.disabled=!ag.checked);
  document.getElementById('back').addEventListener('click',step3);
  go.addEventListener('click',async()=>{go.disabled=true;go.textContent='締結しています…';
    const hash=await sha256(C.body);const signer={name:S.name,company:S.company,title:S.title,addr:S.addr,mail:S.mail,tel:S.tel,stampAt:S.stampAt,agreeAt:nowStr(),ua:navigator.userAgent.slice(0,160)};
    try{
      if(REMOTE){const j=await KT.call('contractSign',{t:token,signer,hash});C=Object.assign(C,j);}
      else{const a=getJ('kt-db-ctr',[])||[];const c=a.find(x=>x.token===token);if(!c)throw {message:'契約書が見つかりませんでした'};c.status='締結';c.signedAt=nowStr();c.signer=signer;c.hash=hash;c.log=c.log||[];c.log.unshift({at:c.signedAt,text:'お客様が署名・押印し、締結（'+signer.name+'）'});setJ('kt-db-ctr',a);
        const ks=getJ('kt-db-case',[])||[];const k=ks.find(x=>x.id===c.caseId);if(k){k.log=k.log||[];k.log.unshift({at:c.signedAt,kind:'その他',by:'お客様',text:'契約書 '+c.no+' が電子契約で締結されました'});setJ('kt-db-case',ks);}C=Object.assign(C,c);}
      doneView();
    }catch(e){document.getElementById('er').textContent=(e.message||'締結できませんでした')+'。時間をおいてもう一度お試しください。';go.disabled=false;go.textContent='同意して締結する';}
  });
  window.scrollTo(0,0);
}
function doneView(){
  const s=C.signer||{};
  main.innerHTML=`<div class="card" style="background:var(--green-p);border-color:#c9d5bd"><h1 style="font-size:21px">契約が締結されました</h1><p>ありがとうございました。下の内容を控えとして保存してください（印刷やPDFで保存できます）。</p><dl><dt>契約書</dt><dd>${esc(C.title)}（${esc(C.no||'')}）</dd><dt>締結日時</dt><dd>${esc(C.signedAt||'')}</dd><dt>署名者</dt><dd>${esc(s.name||'')}${s.company?'（'+esc(s.company)+' '+esc(s.title||'')+'）':''}</dd><dt>確認番号</dt><dd style="font-size:12.5px">${esc(C.hash||'')}</dd></dl><div class="row"><button class="btn btn-main" id="pr">印刷・PDFで保存</button></div><p class="note np">確認番号は、締結した契約書の本文から作った値です。本文が1文字でも変わると番号が変わるため、内容が改変されていないことの確認に使えます。</p></div><div class="card"><h2 style="font-size:18px">契約書</h2><div class="doc" style="max-height:none">${esc(C.body)}</div><div style="display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:10px">${sealHTML(s.name,64)}<span class="note">電子契約により締結　${esc(C.signedAt||'')}</span></div></div>`;
  document.getElementById('pr').addEventListener('click',()=>{try{window.print();}catch(e){}});window.scrollTo(0,0);
}
load();
})();
</script>
</body>
</html>

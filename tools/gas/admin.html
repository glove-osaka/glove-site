<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件管理｜株式会社グローブ</title>
<style>
:root{--navy:#0E2A52;--navy2:#163A6B;--gold:#C79A4A;--gold2:#8A6424;--ink:#1B2B40;--mute:#5E6E82;--line:#DCE3EC;--bg:#F3F6FA;--red:#C0392B;--redbg:#FDECEA;--yel:#B7791F;--yelbg:#FFF6E0;--grn:#2F7D5B;--grnbg:#E8F5EE;--blue:#2C5C93;--bluebg:#EAF1FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.hide{display:none!important}
/* ログイン */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0B2242,#163A6B)}
.lg-box{width:min(380px,100%);background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:grid;gap:14px}
.lg-box h1{margin:0;font-size:1.2rem;color:var(--navy);text-align:center}
.lg-box p{margin:0;font-size:.82rem;color:var(--mute);text-align:center}
label.f{display:grid;gap:4px;font-size:.84rem;font-weight:700}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:.95rem}
.route .p.sug{color:var(--gold2)}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid #C6D0DC;border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,74,.25)}
.btn{border:1px solid transparent;border-radius:999px;padding:9px 18px;font-weight:700;background:#fff;border-color:var(--line)}
.btn:hover{border-color:var(--gold)}
.btn-navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-navy:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:5px 12px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:.86rem;min-height:1.2em}
/* 上部 */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.05rem;letter-spacing:.06em;margin-right:auto}
header .who{font-size:.84rem;opacity:.85}
header .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
header .btn.on{background:var(--gold);border-color:var(--gold)}
nav.tabs{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}
nav.tabs .cnt{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:.74rem;line-height:1.6}
main{padding:16px;max-width:1280px;margin:0 auto}
/* 集計 */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:1.7rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--mute)}
.kpi.red b{color:var(--red)}.kpi.yel b{color:var(--yel)}.kpi.blue b{color:var(--blue)}.kpi.grn b{color:var(--grn)}
.kpi.red.has{background:var(--redbg);border-color:#F2B8B1;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 4px rgba(192,57,43,.18)}}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:1/-1}}
.alertbar{display:flex;gap:10px;align-items:center;background:var(--redbg);border:1px solid #F2B8B1;color:#7A2219;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.alertbar .bell{font-size:1.3rem;animation:ring 1.2s ease-in-out infinite;transform-origin:50% 0}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
/* 絞り込み */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:700}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters input,.filters select{width:auto;flex:1 1 180px;padding:7px 12px}
/* 一覧 */
.list{display:grid;gap:8px}
.case{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,1.3fr);gap:6px 16px;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--grn);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.case:hover{border-color:var(--gold)}
.case.lv1{border-left-color:var(--yel)}.case.lv2{border-left-color:var(--red);background:#FFFBFA}.case.new{border-left-color:var(--red)}
.case.done{opacity:.72;border-left-color:#AAB6C4}
.c-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--mute)}
.c-name{font-weight:700;font-size:1rem;color:var(--navy)}
.c-sub{font-size:.84rem;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:700;border:1px solid}
.b-red{color:var(--red);background:var(--redbg);border-color:#F2B8B1}
.b-yel{color:var(--yel);background:var(--yelbg);border-color:#F1D59A}
.b-grn{color:var(--grn);background:var(--grnbg);border-color:#B5DCC8}
.b-blue{color:var(--blue);background:var(--bluebg);border-color:#BCD0EA}
.b-gray{color:var(--mute);background:#F1F4F8;border-color:var(--line)}
.route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.86rem}
.route .arr{color:var(--gold2);font-weight:700}
.route .p{font-weight:700;color:var(--navy)}
.route .p.none{color:var(--yel)}
.steps{display:flex;gap:3px;align-items:center}
.steps i{flex:1;height:8px;border-radius:4px;background:#E2E8F0}
.steps i.on{background:var(--gold)}
.steps i.cur{background:var(--navy)}
.steps.stop i.on,.steps.stop i.cur{background:#AAB6C4}
.c-st{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-top:4px;color:var(--mute)}
.c-st b{color:var(--navy)}
@media(max-width:900px){.case{grid-template-columns:1fr}}
.empty{background:#fff;border:1px dashed #C6D0DC;border-radius:12px;padding:30px;text-align:center;color:var(--mute)}
/* 詳細 */
#drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(10,24,46,.45)}
.dr{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);box-shadow:-10px 0 30px rgba(0,0,0,.2);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px}
.dr-head h2{margin:0;font-size:1rem;margin-right:auto}
.dr-head .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.dr-body{padding:14px 16px 40px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card h3{margin:0;font-size:.95rem;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mute)}
.stepbtns{display:flex;flex-wrap:wrap;gap:6px}
.stepbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:.84rem;font-weight:700;position:relative}
.stepbtns button.past{background:#FBF4E6;border-color:#E9D2A4;color:var(--gold2)}
.stepbtns button.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.stepbtns button.stop{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:6px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.hint{font-size:.82rem;color:var(--mute)}
.hint.warn{color:var(--yel);font-weight:700}
.hint.red{color:var(--red);font-weight:700}
.compose{border:2px solid var(--gold)}
.compose.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(199,154,74,.35)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl li{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.86rem}
.tl li.send{border-left-color:var(--gold)}
.tl li.upd{border-left-color:var(--navy)}
.tl time{color:var(--mute);font-size:.78rem;margin-right:8px}
.tl .t{white-space:pre-wrap}
/* 設定 */
table.rt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.rt th,table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:.88rem}
table.rt th{background:#EEF2F7;color:var(--navy)}
table.rt input{padding:7px 10px}
@media(max-width:760px){table.rt thead{display:none}table.rt tr{display:grid;gap:4px;padding:8px 0}table.rt td{border:0;padding:2px 10px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:.9rem}
.loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(243,246,250,.6);font-weight:700;color:var(--navy)}
</style>
</head>
<body>

<section id="login">
  <form class="lg-box" id="lgf" autocomplete="on">
    <h1>株式会社グローブ<br>案件管理</h1>
    <p>ID とパスワードを入れてください</p>
    <label class="f">ID<input type="text" id="lg-id" autocomplete="username" required></label>
    <label class="f">パスワード<input type="password" id="lg-pw" autocomplete="current-password" required></label>
    <div class="err" id="lg-err" role="alert"></div>
    <button class="btn btn-navy" type="submit" id="lg-btn">ログイン</button>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <h1>株式会社グローブ　案件管理</h1>
    <span class="who" id="who"></span>
    <button class="btn btn-sm" id="b-sound" type="button" aria-pressed="false">🔔 通知音 オフ</button>
    <button class="btn btn-sm" id="b-reload" type="button">↻ 最新にする</button>
    <button class="btn btn-sm" id="b-logout" type="button">ログアウト</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="inbox" aria-selected="true">お問い合わせ<span class="cnt hide" id="cnt-inbox"></span></button>
    <button role="tab" data-tab="partners" aria-selected="false">提携申込み<span class="cnt hide" id="cnt-partners"></span></button>
    <button role="tab" data-tab="routes" aria-selected="false">振分け設定</button>
    <button role="tab" data-tab="users" aria-selected="false">担当者・パスワード</button>
  </nav>
  <main id="main"></main>
</section>

<div id="drawer" class="hide"></div>
<div id="toast" class="hide"></div>
<div id="loading" class="loading hide">読み込み中…</div>

<script>
/* ===== 共通 ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const lstore = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function call(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => {
    if (String(e && e.message || e).includes("LOGIN_REQUIRED")) { toLogin("時間がたったため、もう一度ログインしてください。"); }
    rej(e);
  })[fn](...args));
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hide"), 2600); }
function busy(on) { $("#loading").classList.toggle("hide", !on); }
function parseTs(s) { if (!s) return null; const m = String(s).match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); if (!m) { const d = new Date(s); return isNaN(d) ? null : d; } return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], (+(m[4] || 0)) - 9, +(m[5] || 0), +(m[6] || 0))); }
function ago(s) {
  const d = parseTs(s); if (!d) return "—";
  const m = Math.max(0, (Date.now() - d.getTime()) / 6e4);
  if (m < 60) return Math.floor(m) + "分";
  const h = m / 60; if (h < 24) return Math.floor(h) + "時間";
  const dd = Math.floor(h / 24), hh = Math.floor(h % 24); return dd + "日" + (dd < 3 && hh ? hh + "時間" : "");
}
function jst(s) { const d = parseTs(s); if (!d) return "—"; const z = new Date(d.getTime() + 9 * 36e5); return `${z.getUTCMonth() + 1}/${z.getUTCDate()} ${String(z.getUTCHours()).padStart(2, "0")}:${String(z.getUTCMinutes()).padStart(2, "0")}`; }

/* ===== 状態 ===== */
let TOKEN = store.get("gl-token"), D = null, TAB = "inbox", FILTER = "need", Q = "", CAT = "", PART = "", OPEN = null, SOUND = lstore.get("gl-sound") === "1", SEEN = null;

/* ===== ログイン ===== */
function toLogin(msg) { TOKEN = null; store.del("gl-token"); $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#drawer").classList.add("hide"); $("#lg-err").textContent = msg || ""; }
$("#lgf").addEventListener("submit", async e => {
  e.preventDefault(); unlockAudio();
  const btn = $("#lg-btn"); btn.disabled = true; $("#lg-err").textContent = "";
  try {
    const r = await call("login", $("#lg-id").value, $("#lg-pw").value);
    if (!r.ok) { $("#lg-err").textContent = r.error; return; }
    TOKEN = r.token; store.set("gl-token", TOKEN); $("#lg-pw").value = "";
    await load(true);
  } catch (err) { $("#lg-err").textContent = "接続できませんでした。時間をおいてお試しください。"; }
  finally { btn.disabled = false; }
});
$("#b-logout").addEventListener("click", async () => { try { await call("logout", TOKEN); } catch (e) {} toLogin("ログアウトしました。"); });

/* ===== 通知音 ===== */
let AC = null;
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} }
function chime(strong) {
  if (!SOUND || !AC) return;
  const t = AC.currentTime; const notes = strong ? [880, 660, 880, 660] : [784, 1046];
  notes.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t + i * .22); g.gain.exponentialRampToValueAtTime(.25, t + i * .22 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + i * .22 + .2);
    o.connect(g); g.connect(AC.destination); o.start(t + i * .22); o.stop(t + i * .22 + .22); });
}
function paintSound() { const b = $("#b-sound"); b.textContent = SOUND ? "🔔 通知音 オン" : "🔕 通知音 オフ"; b.classList.toggle("on", SOUND); b.setAttribute("aria-pressed", SOUND); }
$("#b-sound").addEventListener("click", () => { unlockAudio(); SOUND = !SOUND; lstore.set("gl-sound", SOUND ? "1" : "0"); paintSound(); if (SOUND) chime(false); });

/* ===== 読み込み ===== */
async function load(first) {
  if (first) busy(true);
  try {
    const prev = D;
    D = await call("adminData", TOKEN);
    $("#login").classList.add("hide"); $("#app").classList.remove("hide");
    $("#who").textContent = D.me.name + " さん";
    paintSound();
    D.cases.forEach(c => Object.assign(c, level(c)));
    // 新着・警告の増加で音を鳴らす
    const reds = D.cases.filter(c => c.lv === 2).map(c => c.no);
    if (first) { if (reds.length) chime(true); }
    else if (prev) {
      const oldNos = new Set(prev.cases.map(c => c.no)), oldRed = new Set(prev.cases.filter(c => c.lv === 2).map(c => c.no));
      const fresh = D.cases.filter(c => !oldNos.has(c.no));
      if (fresh.length) { chime(false); toast(`新しい受付が${fresh.length}件あります`); }
      else if (reds.some(n => !oldRed.has(n))) chime(true);
    }
    render();
    if (OPEN) { const c = D.cases.find(x => x.no === OPEN); if (c) openCase(c.no, true); }
  } catch (e) { if (TOKEN) toast("読み込みに失敗しました"); }
  finally { busy(false); }
}
$("#b-reload").addEventListener("click", () => load(false));
setInterval(() => { if (TOKEN && D && !document.hidden) load(false); }, 3 * 60 * 1000);

/* ===== 注意度 ===== */
function isEnd(c) { return c.status === D.stopped[c.kind] || c.status === D.steps[c.kind][D.steps[c.kind].length - 1]; }
function level(c) {
  if (isEnd(c)) return { lv: 0, why: "" };
  const R = D.rules, now = Date.now(), ts = parseTs(c.ts), up = parseTs(c.updated) || ts;
  const h = (now - (ts ? ts.getTime() : now)) / 36e5, d = (now - (up ? up.getTime() : now)) / 864e5;
  if (c.status === D.steps[c.kind][0] && h >= R.newHours) return { lv: 2, why: `未対応のまま${ago(c.ts)}` };
  if (d >= R.staleRedDays) return { lv: 2, why: `${Math.floor(d)}日間 進捗なし` };
  if (d >= R.staleDays) return { lv: 1, why: `${Math.floor(d)}日間 進捗なし` };
  if (c.status === D.steps[c.kind][0]) return { lv: 1, why: "未対応" };
  return { lv: 0, why: "" };
}
const isNew = c => c.status === D.steps[c.kind][0];

/* ===== 画面 ===== */
$$("nav.tabs button").forEach(b => b.addEventListener("click", () => { TAB = b.dataset.tab; $$("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b)); render(); }));
function render() {
  ["inbox", "partners"].forEach(k => { const n = D.cases.filter(c => c.kind === k && c.lv === 2).length + D.cases.filter(c => c.kind === k && isNew(c) && c.lv !== 2).length;
    const el = $("#cnt-" + k); el.textContent = n; el.classList.toggle("hide", !n); });
  const reds = D.cases.filter(c => c.lv === 2).length;
  document.title = (reds ? `(${reds}) ` : "") + "案件管理｜株式会社グローブ";
  if (TAB === "routes") return renderRoutes();
  if (TAB === "users") return renderUsers();
  renderList();
}

function renderList() {
  const all = D.cases.filter(c => c.kind === TAB).sort((a, b) => (parseTs(b.ts) || 0) - (parseTs(a.ts) || 0));
  const cnt = {
    new: all.filter(isNew).length, red: all.filter(c => c.lv === 2).length, yel: all.filter(c => c.lv === 1 && !isNew(c)).length,
    doing: all.filter(c => !isEnd(c) && !isNew(c)).length,
    done: all.filter(c => isEnd(c) && (parseTs(c.updated) || 0) > Date.now() - 30 * 864e5).length
  };
  let list = all.filter(c => FILTER === "all" ? true : FILTER === "need" ? c.lv > 0 || isNew(c) : FILTER === "new" ? isNew(c) : FILTER === "doing" ? !isEnd(c) && !isNew(c) : isEnd(c));
  if (CAT) list = list.filter(c => (c.cat || c.industry) === CAT);
  if (PART) list = list.filter(c => (c.partner || "") === (PART === "__none" ? "" : PART));
  if (Q) { const q = Q.toLowerCase(); list = list.filter(c => Object.values(c).join(" ").toLowerCase().includes(q)); }
  const cats = [...new Set(all.map(c => c.cat || c.industry).filter(Boolean))];
  const parts = [...new Set(all.map(c => c.partner).filter(Boolean))];
  const chips = [["need", "対応が必要"], ["new", "未対応"], ["doing", "対応中"], ["end", "完了・見送り"], ["all", "すべて"]];
  $("#main").innerHTML = `
    ${cnt.red ? `<div class="alertbar" role="alert"><span class="bell">🔔</span>対応が遅れている案件が ${cnt.red} 件あります。赤い線の案件から対応してください。</div>` : ""}
    <div class="kpis">
      <button class="kpi red ${cnt.new ? "has" : ""}" data-f="new"><b>${cnt.new}</b><span>未対応（新規受付）</span></button>
      <button class="kpi red ${cnt.red ? "has" : ""}" data-f="need"><b>${cnt.red}</b><span>警告（遅れ・放置）</span></button>
      <button class="kpi yel" data-f="need"><b>${cnt.yel}</b><span>注意（進捗報告なし）</span></button>
      <button class="kpi blue" data-f="doing"><b>${cnt.doing}</b><span>対応中</span></button>
      <button class="kpi grn" data-f="end"><b>${cnt.done}</b><span>30日以内の完了・見送り</span></button>
    </div>
    <div class="filters">
      ${chips.map(([k, t]) => `<button class="chip" data-chip="${k}" aria-pressed="${FILTER === k}">${t}</button>`).join("")}
      <input type="text" id="q" placeholder="名前・会社・受付番号で探す" value="${esc(Q)}">
      <select id="fcat"><option value="">分類：すべて</option>${cats.map(c => `<option ${c === CAT ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      ${TAB === "inbox" ? `<select id="fpart"><option value="">振分け先：すべて</option><option value="__none" ${PART === "__none" ? "selected" : ""}>未設定</option>${parts.map(p => `<option ${p === PART ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>` : ""}
    </div>
    <div class="list">${list.length ? list.map(row).join("") : `<div class="empty">該当する案件はありません。</div>`}</div>`;
  $$(".kpi").forEach(b => b.addEventListener("click", () => { FILTER = b.dataset.f; renderList(); }));
  $$("[data-chip]").forEach(b => b.addEventListener("click", () => { FILTER = b.dataset.chip; renderList(); }));
  $("#q").addEventListener("input", e => { Q = e.target.value; clearTimeout(renderList.t); renderList.t = setTimeout(() => { renderList(); const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 300); });
  $("#fcat").addEventListener("change", e => { CAT = e.target.value; renderList(); });
  const fp = $("#fpart"); if (fp) fp.addEventListener("change", e => { PART = e.target.value; renderList(); });
  $$(".case").forEach(b => b.addEventListener("click", () => openCase(b.dataset.no)));
}

function sugg(c) { const r = c.kind === "inbox" && D.routes.find(x => x.cat === c.cat); return r && r.partner ? r.partner : ""; }
function stepsBar(c) {
  const st = D.steps[c.kind], i = st.indexOf(c.status), stop = c.status === D.stopped[c.kind];
  return `<div class="steps ${stop ? "stop" : ""}" title="${esc(st.join(" → "))}">${st.map((s, j) => `<i class="${j < i ? "on" : j === i ? "cur" : ""}"></i>`).join("")}</div>`;
}
function stBadge(c) {
  if (c.status === D.stopped[c.kind]) return `<span class="badge b-gray">${esc(c.status)}</span>`;
  if (isEnd(c)) return `<span class="badge b-grn">✓ ${esc(c.status)}</span>`;
  if (isNew(c)) return `<span class="badge b-red">● ${esc(c.status)}</span>`;
  return `<span class="badge b-blue">${esc(c.status)}</span>`;
}
function row(c) {
  const name = c.kind === "inbox" ? (c.company || "（会社名なし）") : c.company, person = c.kind === "inbox" ? c.name : c.person;
  const cat = c.cat || c.industry || "—";
  const warn = c.lv === 2 ? `<span class="badge b-red">⚠ ${esc(c.why)}</span>` : c.lv === 1 ? `<span class="badge b-yel">△ ${esc(c.why)}</span>` : "";
  const contact = c.contacted ? `最終連絡 ${ago(c.contacted)}前` : "お客様へ未連絡";
  return `<button class="case lv${c.lv} ${isNew(c) ? "new" : ""} ${isEnd(c) ? "done" : ""}" data-no="${esc(c.no)}">
    <div><div class="c-top"><span>${esc(c.no)}</span><span>受付 ${jst(c.ts)}</span><span class="badge b-gray">受付から ${ago(c.ts)}</span>${warn}</div>
      <div class="c-name">${esc(name)}</div><div class="c-sub">${esc(person)} 様${c.method ? "　希望：" + esc(c.method) : ""}</div></div>
    <div class="route">${c.kind === "inbox" ? `<span>${esc(cat)}</span><span class="arr">→</span>${c.partner ? `<span class="p">${esc(c.partner)}</span>` : sugg(c) ? `<span class="p sug">${esc(sugg(c))}（設定から・未確定）</span>` : `<span class="p none">振分け先 未設定</span>`}` : `<span>業種：${esc(cat)}</span>`}
      ${c.staff ? `<span class="badge b-gray">担当 ${esc(c.staff)}</span>` : ""}</div>
    <div>${stepsBar(c)}<div class="c-st">${stBadge(c)}<span>更新 ${ago(c.updated)}前・${contact}</span></div></div>
  </button>`;
}

/* ===== 詳細 ===== */
function hist(no) { return D.history.filter(h => h.no === no).sort((a, b) => (parseTs(b.at) || 0) - (parseTs(a.at) || 0)); }
function lastContact(c) { const h = hist(c.no).find(x => x.type === "お客様へ連絡"); return h ? h.at : c.contacted; }
function openCase(no, keep) {
  const c = D.cases.find(x => x.no === no); if (!c) return;
  OPEN = no;
  const st = D.steps[c.kind], i = st.indexOf(c.status);
  const routeHint = c.kind === "inbox" ? (D.routes.find(r => r.cat === c.cat) || null) : null;
  const partners = [...new Set(D.routes.map(r => r.partner).filter(Boolean).concat(c.partner ? [c.partner] : []))];
  const staffList = [...new Set(D.users.map(u => u.name).concat(c.staff ? [c.staff] : []))];
  const info = c.kind === "inbox"
    ? [["会社名・屋号", c.company], ["お名前", c.name + " 様"], ["メール", c.email], ["電話番号", c.tel], ["希望連絡方法", c.method], ["入口", c.entry], ["分類", c.cat], ["情報提供の同意", c.share], ["お問い合わせ内容", c.body]]
    : [["会社名", c.company], ["担当者名", c.person + " 様"], ["業種", c.industry], ["所在地", c.address], ["電話番号", c.tel], ["メール", c.email], ["提供サービス", c.service], ["対応地域", c.area], ["提携希望内容", c.want], ["備考", c.note]];
  const lc = lastContact(c), lcH = lc ? (Date.now() - parseTs(lc).getTime()) / 36e5 : null;
  const tl = hist(c.no);
  const prevScroll = keep && $(".dr") ? $(".dr").scrollTop : 0;
  $("#drawer").innerHTML = `<div class="dr" role="dialog" aria-label="案件の詳細">
    <div class="dr-head"><h2>${esc(c.no)}　${esc(c.company || c.name)}</h2><button class="btn btn-sm" id="d-close">閉じる ✕</button></div>
    <div class="dr-body">
      ${c.lv ? `<div class="alertbar" style="margin:0;${c.lv === 1 ? "background:var(--yelbg);border-color:#F1D59A;color:#7A5210" : ""}"><span class="bell">${c.lv === 2 ? "🔔" : "△"}</span>${esc(c.why)}　受付から ${ago(c.ts)}・最終更新から ${ago(c.updated)}</div>` : ""}
      <div class="card"><h3>進み具合 <small>押すとその段階に進めます</small></h3>
        <div class="stepbtns">${st.map((s, j) => `<button data-step="${esc(s)}" class="${j < i ? "past" : j === i ? "cur" : ""}">${j + 1}. ${esc(s)}</button>`).join("")}
          <button data-step="${esc(D.stopped[c.kind])}" class="stop ${c.status === D.stopped[c.kind] ? "cur" : ""}">${esc(D.stopped[c.kind])}</button></div>
        <div class="grid2">
          ${c.kind === "inbox" ? `<label class="f">振分け先（提携企業）<select id="d-partner"><option value="">（未設定）</option>${partners.map(p => `<option ${p === (c.partner || sugg(c)) ? "selected" : ""}>${esc(p)}</option>`).join("")}<option value="__other">ほかの会社を入力…</option></select>
            <span class="hint">${routeHint && routeHint.partner ? `分類「${esc(c.cat)}」の振分け先：<b>${esc(routeHint.partner)}</b>${routeHint.person ? "（" + esc(routeHint.person) + "）" : ""}${routeHint.contact ? "　" + esc(routeHint.contact) : ""}` : `分類「${esc(c.cat)}」の振分け先は未設定です（振分け設定で登録できます）`}</span></label>` : ""}
          <label class="f">担当者<select id="d-staff"><option value="">（未設定）</option>${staffList.map(s => `<option ${s === c.staff ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
          <label class="f">次の対応予定日<input type="date" id="d-next" value="${esc((c.next || "").replace(/\//g, "-").slice(0, 10))}"></label>
        </div>
        <div class="row"><button class="btn btn-navy btn-sm" id="d-save">保存する</button><span class="hint">受付から ${ago(c.ts)}・最終更新から ${ago(c.updated)}</span></div>
      </div>

      <div class="card compose" id="compose"><h3>📨 お客様への進捗報告 <small>文面は自動で作ります。送るかどうかは担当者が決めます</small></h3>
        <div class="hint ${lcH != null && lcH < D.rules.recontactHours ? "warn" : ""}">${lc ? `前回の連絡：${jst(lc)}（${ago(lc)}前）${lcH < D.rules.recontactHours ? `　※${D.rules.recontactHours}時間以内です。連絡が多すぎないか確かめてください` : ""}` : "まだお客様へ連絡していません"}</div>
        ${c.method === "電話" ? `<div class="hint red">お客様は「電話」での連絡を希望しています。電話で伝えた場合は「送らずに記録」を押してください。</div>` : ""}
        <label class="f">報告の内容<select id="r-kind">${st.concat([D.stopped[c.kind], "途中経過のお知らせ"]).map(s => `<option ${s === c.status ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
        <label class="f">件名<input type="text" id="r-sub"></label>
        <label class="f">本文<textarea id="r-body" rows="12" style="min-height:260px"></textarea></label>
        <div class="row">
          <button class="btn btn-sm" id="r-again">↻ 別の言い回しで作り直す</button>
          <button class="btn btn-gold btn-sm" id="r-send">お客様へ送信する</button>
          <button class="btn btn-sm" id="r-skip">送らずに記録</button>
          <span class="hint">送り先：${esc(c.email)}</span>
        </div>
      </div>

      <div class="card"><h3>お客様の情報</h3><dl class="kv">${info.map(([k, v]) => `<dt>${k}</dt><dd>${k === "電話番号" && v ? `<a href="tel:${esc(String(v).replace(/[^\d+]/g, ""))}">${esc(v)}</a>` : k === "メール" && v ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : esc(v || "—")}</dd>`).join("")}</dl></div>

      <div class="card"><h3>対応メモ</h3>
        ${c.memo ? `<div class="hint" style="white-space:pre-wrap;color:var(--ink)">${esc(c.memo)}</div>` : ""}
        <textarea id="d-memo" placeholder="電話で話した内容、提携先とのやりとりなど" style="min-height:70px"></textarea>
        <div class="row"><button class="btn btn-sm" id="d-memo-add">メモを追加</button></div></div>

      <div class="card"><h3>対応の履歴</h3>${tl.length ? `<ul class="tl">${tl.map(h => `<li class="${h.type === "お客様へ連絡" ? "send" : h.type === "更新" ? "upd" : ""}"><time>${jst(h.at)}</time><b>${esc(h.type)}</b>${h.by ? "　" + esc(h.by) : ""}${h.to ? "　→ " + esc(h.to) : ""}<div class="t">${esc(h.text)}</div></li>`).join("")}</ul>` : `<div class="hint">まだ履歴はありません。</div>`}</div>
    </div></div>`;
  $("#drawer").classList.remove("hide");
  if (keep) $(".dr").scrollTop = prevScroll;
  $("#drawer").onclick = e => { if (e.target.id === "drawer") closeCase(); };
  $("#d-close").onclick = closeCase;
  const ps = $("#d-partner");
  if (ps) ps.onchange = () => { if (ps.value === "__other") { const v = prompt("振分け先の会社名を入れてください"); if (v) { const o = document.createElement("option"); o.textContent = v.trim(); o.selected = true; ps.insertBefore(o, ps.lastElementChild); } else ps.value = c.partner || ""; } };
  $("#d-save").onclick = () => save(c, {});
  $$("[data-step]").forEach(b => b.onclick = () => {
    const s = b.dataset.step; if (s === c.status) return;
    if (s === D.stopped[c.kind] && !confirm("「" + s + "」にしますか？")) return;
    save(c, { status: s }, true);
  });
  $("#d-memo-add").onclick = async () => { const m = $("#d-memo").value.trim(); if (!m) return; busy(true); try { await call("updateCase", TOKEN, c.kind, c.no, { memo: m }); toast("メモを追加しました"); await load(false); } catch (e) { toast("保存できませんでした"); } finally { busy(false); } };
  let variant = 0;
  const fill = () => { const r = genReport(c, $("#r-kind").value, variant); $("#r-sub").value = r.subject; $("#r-body").value = r.body; };
  fill();
  $("#r-kind").onchange = () => { variant = 0; fill(); };
  $("#r-again").onclick = () => { variant++; fill(); };
  $("#r-send").onclick = async () => {
    if (lcH != null && lcH < D.rules.recontactHours && !confirm(`前回の連絡から${ago(lc)}しかたっていません。それでも送りますか？`)) return;
    if (!confirm(`${c.email} へ送信します。よろしいですか？`)) return;
    busy(true);
    try { const r = await call("sendReport", TOKEN, c.kind, c.no, $("#r-sub").value, $("#r-body").value, true);
      if (!r.ok) { toast(r.error); return; } toast("送信しました"); await load(false); }
    catch (e) { toast("送信できませんでした"); } finally { busy(false); }
  };
  $("#r-skip").onclick = async () => { busy(true); try { await call("sendReport", TOKEN, c.kind, c.no, $("#r-sub").value, $("#r-body").value, false); toast("送らずに記録しました"); await load(false); } catch (e) { toast("記録できませんでした"); } finally { busy(false); } };
}
function closeCase() { OPEN = null; $("#drawer").classList.add("hide"); $("#drawer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && OPEN) closeCase(); });

async function save(c, extra, stepped) {
  const patch = Object.assign({ staff: $("#d-staff").value, next: $("#d-next").value ? $("#d-next").value.replace(/-/g, "/") : "" }, extra);
  const ps = $("#d-partner"); if (ps) patch.partner = ps.value === "__other" ? c.partner : ps.value;
  // 振り分けの段階に進めたとき、振分け先が空なら設定から自動で入れる
  if (c.kind === "inbox" && patch.status === "振分け済み" && !patch.partner) { const r = D.routes.find(x => x.cat === c.cat); if (r && r.partner) patch.partner = r.partner; }
  busy(true);
  try {
    await call("updateCase", TOKEN, c.kind, c.no, patch);
    toast(stepped ? `「${patch.status}」にしました。進捗報告を確認してください` : "保存しました");
    await load(false);
    if (stepped && OPEN === c.no) { const cp = $("#compose"); if (cp) { cp.scrollIntoView({ behavior: "smooth", block: "start" }); cp.classList.add("flash"); } }
  } catch (e) { toast("保存できませんでした"); } finally { busy(false); }
}

/* ===== 進捗報告の文面を作る ===== */
function genReport(c, kind, v) {
  const inbox = c.kind === "inbox";
  const who = inbox ? `${c.company ? c.company + "\n" : ""}${c.name} 様` : `${c.company}\n${c.person} 様`;
  const topic = inbox ? `「${c.cat}」に関するお問い合わせ` : "業務提携のお申し込み";
  const staff = c.staff || (D.me && D.me.name) || "担当";
  const share = String(c.share || "").startsWith("同意あり");
  const open = [
    `このたびは株式会社グローブへ${topic}をいただき、誠にありがとうございます。`,
    `いつもお世話になっております。株式会社グローブでございます。\n先日いただきました${topic}につきまして、ご連絡いたします。`,
    `${topic}をいただき、ありがとうございます。株式会社グローブの${staff}でございます。`
  ][v % 3];
  const close = [
    `ご不明な点がございましたら、このメールへのご返信、またはお電話にてお気軽にお問い合わせください。`,
    `ご質問やご要望がございましたら、受付番号を添えてご返信いただけますと、すぐに確認いたします。`,
    `引き続きどうぞよろしくお願いいたします。お急ぎの場合はお電話でもご連絡ください。`
  ][(v + 1) % 3];
  const B = {
    "新規受付": `${topic}を確かに受け付けました。\n内容を確認のうえ、担当者より改めてご連絡いたします。`,
    "内容確認中": `いただいた内容を、担当の${staff}が確認しております。\n必要に応じて、詳しい状況をお電話またはメールでお伺いすることがございます。2〜3営業日を目安に、今後の進め方をご案内いたします。`,
    "振分け済み": share
      ? `ご相談の内容に合わせて、対応する専門の提携事業者を選定いたしました。\n今後は当社が窓口となり、提携事業者と連携して進めてまいります。提携事業者から直接ご連絡を差し上げる場合は、事前にお知らせいたします。`
      : `ご相談の内容に合わせて、対応できる専門の提携事業者の候補を選定いたしました。\nお客様の情報を提携事業者へお伝えする前に、改めてご了承のご確認をさせていただきます。追ってご連絡いたしますので、少々お待ちください。`,
    "提携先対応中": `現在、提携事業者とともに、具体的な進め方や必要な準備について検討を進めております。\n進み具合に応じて、改めてご報告いたします。`,
    "提案・見積り中": `ご提案内容（必要に応じてお見積り）を取りまとめております。\nまとまり次第お送りいたしますので、ご確認をお願いいたします。`,
    "完了": `このたびのご相談につきまして、対応が完了いたしましたのでご報告いたします。\nご依頼いただき、誠にありがとうございました。今後も、経営や事業のことでお困りの際は、いつでもお気軽にご相談ください。`,
    "見送り": `ご相談の内容を慎重に検討いたしましたが、誠に恐縮ながら、今回は当社および提携事業者でのお手伝いが難しいとの結論となりました。\nご期待に沿えず申し訳ございません。状況が変わった際や、別のご相談がございましたら、改めてお声がけください。`,
    "途中経過のお知らせ": `ご相談につきまして、引き続き対応を進めております。\n現在の状況：${c.status}\n次の段階に進み次第、改めてご報告いたします。`,
    "審査待ち": `業務提携のお申し込みを確かに受け付けました。\n内容を確認のうえ、担当者より改めてご連絡いたします。`,
    "審査中": `いただいた内容をもとに、提携の可能性について社内で検討しております。\n確認したい点がございましたら、担当よりご連絡いたします。`,
    "面談調整中": `ぜひ一度、詳しくお話をお伺いしたく存じます。\nお打ち合わせ（オンラインまたはご来社）の日程を調整させていただけますでしょうか。ご都合のよい日時を、いくつかお知らせください。`,
    "提携決定": `検討の結果、ぜひ提携を進めさせていただきたく存じます。\n今後の進め方や必要な書類につきまして、担当より改めてご案内いたします。`
  };
  const title = {
    "新規受付": "受付のお知らせ", "内容確認中": "内容確認のご報告", "振分け済み": "今後の進め方のご報告", "提携先対応中": "進捗のご報告",
    "提案・見積り中": "ご提案準備のご報告", "完了": "対応完了のご報告", "見送り": "ご相談へのご回答", "途中経過のお知らせ": "途中経過のご報告",
    "審査待ち": "受付のお知らせ", "審査中": "検討状況のご報告", "面談調整中": "お打ち合わせのお願い", "提携決定": "提携に関するご連絡"
  }[kind] || "進捗のご報告";
  const subject = `【株式会社グローブ】${title}（受付番号 ${c.no}）`;
  const body = `${who}\n\n${open}\n\n${B[kind] || B["途中経過のお知らせ"]}\n\n受付番号：${c.no}\n担当：${staff}\n\n${close}\n\n${D.signature}`;
  return { subject, body };
}

/* ===== 振分け設定 ===== */
function renderRoutes() {
  const open = D.cases.filter(c => c.kind === "inbox" && !isEnd(c));
  const cats = [...new Set(D.categories.concat(D.routes.map(r => r.cat)))];
  const rows = cats.map(cat => Object.assign({ cat, partner: "", person: "", contact: "", note: "" }, D.routes.find(r => r.cat === cat) || {}));
  $("#main").innerHTML = `<div class="card" style="margin-bottom:12px"><h3>振分け設定 <small>お客様が選んだ分類ごとに、どの提携企業へ振り分けるかを決めます</small></h3>
    <div class="hint">新しいお問い合わせは、ここの設定どおりに振分け先が自動で入ります。案件ごとに変えることもできます。</div></div>
    <table class="rt"><thead><tr><th>分類</th><th>振分け先（提携企業）</th><th>先方の担当者</th><th>先方の連絡先</th><th>備考</th><th>対応中</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr data-i="${i}"><td><b>${esc(r.cat)}</b></td><td><input type="text" data-k="partner" value="${esc(r.partner)}" placeholder="振分け先の会社名"></td><td><input type="text" data-k="person" value="${esc(r.person)}" placeholder="先方の担当者"></td><td><input type="text" data-k="contact" value="${esc(r.contact)}" placeholder="電話・メール"></td><td><input type="text" data-k="note" value="${esc(r.note)}" placeholder="備考"></td><td>${open.filter(c => c.cat === r.cat).length}件</td></tr>`).join("")}</tbody></table>
    <div class="row" style="margin-top:12px"><button class="btn btn-navy" id="rt-save">保存する</button></div>`;
  $("#rt-save").onclick = async () => {
    const out = rows.map((r, i) => { const o = { cat: r.cat }; $$(`tr[data-i="${i}"] input`).forEach(inp => o[inp.dataset.k] = inp.value.trim()); return o; });
    busy(true); try { const r = await call("saveRoutes", TOKEN, out); D.routes = r.routes; toast("保存しました"); } catch (e) { toast("保存できませんでした"); } finally { busy(false); }
  };
}

/* ===== 担当者・パスワード ===== */
function renderUsers() {
  $("#main").innerHTML = `<div class="grid2">
    <div class="card"><h3>パスワードの変更</h3>
      <label class="f">今のパスワード<input type="password" id="pw-old" autocomplete="current-password"></label>
      <label class="f">新しいパスワード（8文字以上）<input type="password" id="pw-new" autocomplete="new-password"></label>
      <div class="err" id="pw-err"></div><div class="row"><button class="btn btn-navy btn-sm" id="pw-save">変更する</button></div></div>
    <div class="card"><h3>担当者の追加</h3>
      <label class="f">表示する名前<input type="text" id="u-name" placeholder="例：山田"></label>
      <label class="f">ログイン ID（半角英数字）<input type="text" id="u-id" autocomplete="off"></label>
      <label class="f">最初のパスワード（8文字以上）<input type="password" id="u-pw" autocomplete="new-password"></label>
      <div class="err" id="u-err"></div><div class="row"><button class="btn btn-navy btn-sm" id="u-add">追加する</button></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>登録されている担当者</h3><ul class="tl" id="u-list">${D.users.map(u => `<li>${esc(u.name)}（ID：${esc(u.id)}）${u.id !== D.me.id ? ` <button class="btn btn-sm" data-rm="${esc(u.id)}">削除</button>` : "　← あなた"}</li>`).join("")}</ul></div>`;
  $("#pw-save").onclick = async () => { $("#pw-err").textContent = ""; try { const r = await call("changePassword", TOKEN, $("#pw-old").value, $("#pw-new").value); if (!r.ok) { $("#pw-err").textContent = r.error; return; } $("#pw-old").value = $("#pw-new").value = ""; toast("パスワードを変更しました"); } catch (e) { $("#pw-err").textContent = "変更できませんでした"; } };
  $("#u-add").onclick = async () => { $("#u-err").textContent = ""; try { const r = await call("addUser", TOKEN, $("#u-id").value, $("#u-name").value, $("#u-pw").value); if (!r.ok) { $("#u-err").textContent = r.error; return; } D.users = r.users; toast("追加しました"); renderUsers(); } catch (e) { $("#u-err").textContent = "追加できませんでした"; } };
  $$("[data-rm]").forEach(b => b.onclick = async () => { if (!confirm("この担当者を削除しますか？")) return; try { const r = await call("removeUser", TOKEN, b.dataset.rm); if (!r.ok) { toast(r.error); return; } D.users = r.users; renderUsers(); } catch (e) { toast("削除できませんでした"); } });
}

document.addEventListener("pointerdown", unlockAudio, { once: true });
/* ===== 起動 ===== */
if (TOKEN) load(true).catch(() => toLogin()); else toLogin();
</script>
</body>
</html>

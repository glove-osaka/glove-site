# 家じまい相談窓口（iejimai123.jp）：この枝に入れた内容を、エックスサーバーへ自動で送る
name: iejimai123.jp へ自動反映
on:
  push:
    branches: [iejimai123-site]
  workflow_dispatch:
concurrency: iejimai123-deploy
jobs:
  check:
    name: 管理画面の自動確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 確認用の道具を入れる
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: 管理者の画面を確かめる
        run: node tests/kanri-check.js . "" admin
      - name: 担当者の画面を確かめる
        run: node tests/kanri-check.js . "" staff
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 合言葉の確認
        id: chk
        env:
          P: ${{ secrets.FTP_PASSWORD }}
        run: if [ -n "$P" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "合言葉（FTP_PASSWORD）が未登録のため、今回は送りません"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
      - name: エックスサーバーへ送る
        if: steps.chk.outputs.ok == '1'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: sv17329.xserver.jp
          username: deploy@iejimai123.jp
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            node_modules/**
